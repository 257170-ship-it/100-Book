<style>
:root{color-scheme:light;--ink:#20482f;--cream:#fffbed;--gold:#ffe379}
*{box-sizing:border-box}body{margin:0;background:#163c2d;color:var(--ink);font-family:"M PLUS Rounded 1c","Noto Sans TC",sans-serif;overflow:hidden}button{font:inherit;cursor:pointer}button:focus-visible{outline:4px solid #ffac35;outline-offset:4px}
#stage{width:1920px;height:1080px;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--scale,1));overflow:hidden;background:radial-gradient(ellipse at 50% 27%,#e3ffa1 0,#92dc68 34%,#52b666 74%,#37975c 100%)}

header{position:absolute;left:38px;right:38px;top:25px;height:105px;display:flex;align-items:center;gap:22px;z-index:6}.crest{width:85px;height:85px;display:grid;place-items:center;border:5px solid #fff4be;background:#ffcf54;border-radius:28px;box-shadow:0 7px 0 #c59236,0 12px 20px #275d3426;font-size:46px;transform:rotate(-6deg)}h1{font-size:43px;letter-spacing:3px;margin:0;font-weight:900;text-shadow:0 3px #ecffc5}.subtitle{font-size:18px;letter-spacing:3px;margin-top:5px}.stats{display:flex;gap:12px;margin-left:auto}.stat{min-width:156px;background:#f5ffdda8;border:2px solid #fffbd5;border-radius:22px;padding:10px 20px;text-align:center;box-shadow:0 5px 0 #3676412e}.stat strong{font-size:34px;display:block;line-height:1.1}.stat span{font-size:16px}.fullscreen{border:2px solid #effbd1;border-radius:18px;background:#2c6846;color:white;padding:14px 18px;font-size:18px}
.map{position:absolute;inset:130px 390px 190px;width:1140px;height:760px;filter:drop-shadow(0 17px 11px #29674244)}
.water{fill:#70d7ca;stroke:#c0f1b6;stroke-width:11}.terrain{stroke:#668d43;stroke-width:4}.path-shadow{fill:none;stroke:#8e9c46;stroke-width:49;stroke-linecap:round;stroke-linejoin:round}.path{fill:none;stroke:#ffe8a1;stroke-width:38;stroke-linecap:round;stroke-linejoin:round}.path-dots{fill:none;stroke:#d9b65f;stroke-width:3;stroke-dasharray:2 15;stroke-linecap:round}.milestone{font-size:20px;font-weight:900;fill:#386440;paint-order:stroke;stroke:#fff9da;stroke-width:7px}
#connections{position:absolute;inset:0;width:1920px;height:1080px;pointer-events:none;z-index:2}.lead{fill:none;stroke:#fffbe5;stroke-width:1.6;opacity:.17}.lead.active{stroke:#fff5a6;stroke-width:4;opacity:.9}
#hudLayer{position:absolute;inset:0;z-index:4;pointer-events:none}.hud{position:absolute;width:360px;height:98px;padding:8px 12px;background:linear-gradient(160deg,#fffdf1,#f0f4d5);border:3px solid #fff9d8;border-radius:21px;box-shadow:0 6px 0 #448153,0 9px 16px #1b522c25;pointer-events:auto;transition:box-shadow .4s,transform .4s;outline:none}.hud.active{box-shadow:0 0 0 4px #ffe375,0 7px 0 #9c913d,0 0 28px #ffedac;transform:translateY(-3px)}.hud.champion{background:linear-gradient(120deg,#fff8d7,#ffe6a0);border-color:#ffe87f}.hudTop{display:flex;align-items:center;gap:8px;height:30px;white-space:nowrap}.number{display:inline-grid;place-items:center;flex:none;width:29px;height:29px;border-radius:10px;background:var(--color);color:white;font-size:16px;text-shadow:0 1px 2px #25433c}.name{font-size:24px;font-weight:900;overflow:hidden;text-overflow:ellipsis;max-width:143px}.grade{font-size:14px;color:#658066}.count{margin-left:auto;white-space:nowrap;font-size:16px}.count b{font-size:27px;color:#267345}.badges{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:5px}.badge{height:43px;border-radius:10px;background:#d6dcd3b3;color:#637365;border:1px solid #bec8b8;text-align:center;line-height:1.15;padding:3px 0}.badge strong{font-size:14px;display:block}.badge span{font-size:14px;font-weight:800}.badge.clear{background:linear-gradient(135deg,#fff4a1,#ffd356);border-color:#dfaa32;color:#71551d;box-shadow:0 0 7px #ffd54f95,inset 0 1px 0 white}.badge.clear span{font-size:11px;letter-spacing:.6px}.hud.bottom{width:258px;height:117px;padding:9px}.bottom .name{font-size:22px;max-width:96px}.bottom .grade{display:none}.bottom .count{font-size:12px}.bottom .count b{font-size:25px}.bottom .badges{gap:3px;margin-top:10px}.bottom .badge{height:45px}.bottom .badge span{font-size:12px}.bottom .badge.clear span{font-size:9px}
#avatars{position:absolute;inset:0;z-index:3;pointer-events:none}.avatar{position:absolute;width:44px;height:61px;transform:translate(-50%,-100%);transition:left 1.6s ease,top 1.6s ease;filter:drop-shadow(0 5px 2px #28502770)}.avatar svg{width:44px;height:58px;overflow:visible}.avatar .mini{position:absolute;left:27px;top:-5px;border:2px solid #fff8d6;border-radius:10px;background:var(--color);color:white;font-size:15px;min-width:25px;text-align:center;padding:1px 3px}.avatar.active{z-index:9;filter:drop-shadow(0 0 8px #fff2a1)}.avatar.active svg{animation:hop 1.6s infinite}.avatar.done:before{content:"";position:absolute;width:65px;height:65px;border:3px solid #ffed89;box-shadow:0 0 15px #ffeb71,inset 0 0 20px #ffeb71;border-radius:50%;left:-10px;top:0;animation:aura 2s infinite}
.egg-wrap{position:absolute;left:899px;top:171px;width:122px;height:133px;z-index:1}.egg{position:absolute;left:22px;top:0;width:79px;height:101px;border-radius:50% 50% 46% 46%;background:radial-gradient(ellipse at 32% 24%,white 0,#fffbe6 37%,#eadbb7 76%);border:3px solid #fef6c7;box-shadow:inset -10px -8px 15px #b7b49880,0 8px 0 #73865d,0 13px 12px #4a683b77;transform:rotate(-8deg)}.egg i{position:absolute;width:23px;height:17px;border-radius:50%;background:#d69acb;transform:rotate(24deg)}.egg i:nth-child(1){top:24px;left:12px}.egg i:nth-child(2){top:52px;right:8px}.egg i:nth-child(3){bottom:10px;left:16px;width:15px}.egg-caption{position:absolute;top:112px;width:180px;left:-28px;text-align:center;font-size:18px;font-weight:900;background:#fff7ca;border:3px solid #c99746;border-radius:14px;box-shadow:0 4px #6d7545;padding:3px}.summit-on .egg{animation:eggGlow 2s infinite}.spark{display:none;position:absolute;left:60px;top:40px;width:6px;height:6px;background:#fff69c;border-radius:50%;box-shadow:0 -49px #fff2ae,35px -35px #ffe774,49px 0 #fff4cf,35px 35px #ffda66,0 49px #fff4b7,-35px 35px #ffe37a,-49px 0 #fff3a3,-35px -35px #ffef93;animation:fireworks 2.8s infinite}.summit-on .spark{display:block}.spark.second{left:-15px;top:55px;animation-delay:1.4s}.spark.third{left:140px;top:30px;animation-delay:.7s}
.mapTitle{position:absolute;left:770px;top:785px;width:380px;text-align:center;border-radius:23px;background:#285b3de8;color:#fff4c4;padding:13px 18px;z-index:1;box-shadow:0 6px 0 #204c34}.mapTitle b{font-size:25px;display:block;letter-spacing:4px}.mapTitle span{font-size:16px}.footer{position:absolute;bottom:12px;left:36px;right:36px;display:flex;align-items:center;justify-content:space-between;font-size:16px;color:#f2ffdd}.legend{display:flex;gap:21px}.goldDot{color:#ffe270}.status{padding:3px 12px;border-radius:10px;background:#245b3d}.status.error{background:#8b5932}.status.demo{background:#77602f}#clock{font-variant-numeric:tabular-nums}
@keyframes hop{50%{transform:translateY(-7px)}}@keyframes aura{50%{opacity:.5;transform:scale(1.15)}}@keyframes eggGlow{50%{box-shadow:0 0 55px #fff7b4,inset -10px -8px 15px #c0b087,0 8px 0 #b4a664}}@keyframes fireworks{0%,15%{opacity:0;transform:scale(.1)}35%{opacity:1}85%,100%{opacity:0;transform:scale(1.7)}}@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}
</style>

<script>
'use strict';
/* ===================== 使用設定 =====================
 * 1. 填入 Google Apps Script Web App 的 /exec 網址。
 * 2. 留空時顯示 21 位虛構學生，示範模式會明確標示。
 * 3. API 可回傳學生陣列，或 { students: [...] }。
 * 4. 每位學生必要欄位：
 * { name:"小明", grade:3, total_count:45,
 *   grade_progress:{g1:25,g2:12,g3:8,g4:0,g5:0,g6:0} }
 * total_count 獨立決定攀登位置；不強制等於六年級認證合計。
 * 正式模式不會在 API 故障時切換成虛構成績。
 * API 須允許顯示裝置直接讀取；不要在此放任何私密金鑰。
 * 建議以 HTTPS 靜態網站開啟；Google Fonts 無法載入時使用本機字型。
 * ==================================================== */
const API_URL = ''; // 例如 https://script.google.com/macros/s/你的部署ID/exec
const REFRESH_MS = 30_000;
const EXPECTED_STUDENTS = 21;
const GRADE_TARGETS = Object.freeze([25,25,15,15,10,10]);
const COLORS = ['#427bca','#d47d38','#8553ba','#338e7d','#c4607b','#618c37','#b18a30'];
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const trail = $('trail');
let roster = [], focusIndex = -1, refreshTimer, busy = false, lastSuccess = null;
let view = [];
function fit(){document.documentElement.style.setProperty('--scale',Math.min(innerWidth/1920,innerHeight/1080));}
addEventListener('resize',fit);fit();
function node(tag,cls,text){const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el;}
function svgNode(tag,attrs){const el=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));return el;}
function integer(value,min,max,label){if((typeof value!=='number'&&typeof value!=='string')||String(value).trim()===''||!Number.isInteger(Number(value))||Number(value)<min||Number(value)>max)throw new Error(label+' 超出範圍或格式錯誤');return Number(value);}
function normalize(payload){
 const rows=Array.isArray(payload)?payload:payload?.students;
 if(!Array.isArray(rows)||rows.length!==EXPECTED_STUDENTS)throw new Error('資料需包含 21 位學生');
 return rows.map((r,i)=>{
  if(!r||typeof r.name!=='string'||!r.name.trim())throw new Error('第 '+(i+1)+' 位學生缺少姓名');
  const gp={};GRADE_TARGETS.forEach((target,j)=>{gp['g'+(j+1)]=integer(r.grade_progress?.['g'+(j+1)],0,Number.MAX_SAFE_INTEGER,'年級認證本數');});
  return {name:r.name.trim(),grade:integer(r.grade,1,6,'年級'),total_count:integer(r.total_count,0,100,'總本數'),grade_progress:gp};
 });
}
function demo(){
 const names=['小晴','宥辰','子恩','品妍','宇翔','芯語','柏睿','以安','承翰','沐希','奕帆','可欣','禹彤','皓宇','書妍','允樂','宸希','苡晴','昀哲','語芯','樂澄'];
 const totals=[100,100,93,86,81,76,70,65,61,57,53,49,45,45,38,31,25,20,14,8,0];
 return names.map((name,i)=>{let n=totals[i],gp={};GRADE_TARGETS.forEach((t,g)=>{gp['g'+(g+1)]=Math.min(t,n);n=Math.max(0,n-t);});
  if(i===12)Object.assign(gp,{g1:18,g2:12,g3:8,g4:7,g5:0,g6:0});
  return {name,grade:Math.max(1,6-Math.floor(i/4)),total_count:totals[i],grade_progress:gp};});
}
function cardPosition(i){if(i<7)return{x:28,y:153+i*104,w:360,h:98};if(i<14)return{x:1532,y:153+(i-7)*104,w:360,h:98};return{x:30+(i-14)*267,y:907,w:258,h:117};}
function pointAt(total){const p=trail.getPointAtLength(trail.getTotalLength()*total/100);return{x:p.x+390,y:p.y+130};}
// Keep exact progress on the route; only the avatar receives a visual offset.
// Greedy spacing also separates nearby totals and the worst case: 21 equal totals.
function avatarPositions(rows){const placed=[];return rows.map(r=>{const anchor=pointAt(r.total_count);let chosen=null;
 for(let ring=0;ring<12&&!chosen;ring++){
  const candidates=ring===0?[[0,0]]:[[ring*49,0],[-ring*49,0],[0,ring*64],[0,-ring*64]];
  if(ring>0)for(let dx=-ring;dx<=ring;dx++)candidates.push([dx*49,ring*64],[dx*49,-ring*64]);
  for(const [dx,dy]of candidates){const q={x:anchor.x+dx,y:anchor.y+dy};if(q.x<425||q.x>1495||q.y<212||q.y>863)continue;
   if(placed.every(p=>Math.abs(p.x-q.x)>=47||Math.abs(p.y-q.y)>=63)){chosen=q;break;}}
 }
 if(!chosen)throw new Error('小人位置配置失敗');placed.push(chosen);return{...chosen,anchor};});}
function avatarSVG(color){return `<svg viewBox="0 0 44 58"><ellipse cx="22" cy="54" rx="19" ry="5" fill="#28492d" opacity=".25"/><path d="M12 44L10 53H19L21 43M25 43L27 53H36L32 42" fill="#6c533a" stroke="#4b4930" stroke-width="2"/><path d="M10 32Q22 25 34 32L35 45Q22 51 9 45Z" fill="${color}" stroke="#284d3e" stroke-width="2"/><path d="M14 34L30 46" stroke="#f3d272" stroke-width="4"/><ellipse cx="22" cy="23" rx="14" ry="15" fill="#ffdaa2" stroke="#a57743" stroke-width="2"/><path d="M7 19Q4 2 21 2Q34 1 38 18L27 13Z" fill="${color}" stroke="#284d3e" stroke-width="2"/><path d="M10 14L15 10" stroke="#e8f4ba" stroke-width="3" stroke-linecap="round"/><circle cx="17" cy="24" r="2" fill="#3a3e35"/><circle cx="27" cy="24" r="2" fill="#3a3e35"/><path d="M19 30Q22 32 25 30" fill="none" stroke="#a66b4c" stroke-width="1.6"/><path d="M5 32L1 37L4 47L11 43L12 34Z" fill="#efcd7a" stroke="#8e713d" stroke-width="2"/></svg>`;}
function render(rows){
 const positions=avatarPositions(rows);
 $('hudLayer').replaceChildren();$('avatars').replaceChildren();$('connections').replaceChildren();view=[];
 rows.forEach((r,i)=>{
  const c=COLORS[i%COLORS.length],p=positions[i],cp=cardPosition(i),done=r.total_count===100;
  const card=node('article','hud'+(i>=14?' bottom':'')+(done?' champion':''));
  card.style.cssText=`left:${cp.x}px;top:${cp.y}px;--color:${c}`;card.tabIndex=0;
  const top=node('div','hudTop');top.append(node('span','number',String(i+1).padStart(2,'0')),node('span','name',r.name),node('span','grade',r.grade+'年級'));
  const count=node('span','count');count.append(node('b','',r.total_count),document.createTextNode('/100本'));top.append(count);card.append(top);
  const badges=node('div','badges');GRADE_TARGETS.forEach((target,g)=>{const n=r.grade_progress['g'+(g+1)],clear=n>=target,b=node('div','badge'+(clear?' clear':''));b.append(node('strong','',(clear?'✦ ':'')+'G'+(g+1)),node('span','',clear?'CLEAR':`${n}/${target}`));b.title=`${g+1} 年級：${n}/${target} 本${clear?'・認證完成':''}`;badges.append(b);});card.append(badges);
  card.setAttribute('aria-label',`${r.name}，${r.grade}年級，${r.total_count}本。`+GRADE_TARGETS.map((t,g)=>`${g+1}年級 ${r.grade_progress['g'+(g+1)]}/${t}本`).join('，'));
  card.addEventListener('pointerenter',()=>focus(i));card.addEventListener('focus',()=>focus(i));card.addEventListener('click',()=>focus(i));$('hudLayer').append(card);
  const av=node('div','avatar'+(done?' done':''));av.style.cssText=`left:${p.x}px;top:${p.y}px;--color:${c}`;av.innerHTML=avatarSVG(c);av.append(node('span','mini',i+1));$('avatars').append(av);
  const start=i<7?{x:cp.x+cp.w,y:cp.y+48}:i<14?{x:cp.x,y:cp.y+48}:{x:cp.x+cp.w/2,y:cp.y};
  const line=svgNode('path',{class:'lead',d:`M${start.x} ${start.y} L${p.x} ${p.y-25}`});$('connections').append(line);
  // Anchor dot and short tether retain the true route location after collision offset.
  $('connections').append(svgNode('path',{d:`M${p.anchor.x} ${p.anchor.y}L${p.x} ${p.y}`,stroke:c,'stroke-width':2,opacity:.6}),svgNode('circle',{cx:p.anchor.x,cy:p.anchor.y,r:4,fill:c,stroke:'#fff8d6','stroke-width':2}));
  view.push({card,av,line});
 });
 $('students').textContent=rows.length;$('books').textContent=rows.reduce((s,r)=>s+r.total_count,0).toLocaleString('zh-TW');const winners=rows.filter(r=>r.total_count===100).length;$('cleared').textContent=winners;$('summit').classList.toggle('summit-on',winners>0);
 focus(focusIndex<0?0:focusIndex%rows.length);
}
function focus(i){focusIndex=i;view.forEach((v,j)=>{v.card.classList.toggle('active',i===j);v.av.classList.toggle('active',i===j);v.line.classList.toggle('active',i===j);});}
function status(message,type=''){$('status').textContent=message;$('status').className='status '+type;}
function hhmm(date){return date.toLocaleTimeString('zh-TW',{hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'});}
async function refresh(){
 if(!API_URL||busy)return;busy=true;const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),12_000);
 try{
  const response=await fetch(API_URL,{signal:controller.signal,cache:'no-store',redirect:'follow'});
  if(!response.ok)throw new Error('HTTP '+response.status);
  const next=normalize(await response.json());
  if(JSON.stringify(next)!==JSON.stringify(roster)){render(next);roster=next;}
  lastSuccess=new Date();status('已同步 '+hhmm(lastSuccess)+' · 每30秒更新');
 }catch(error){status(roster.length?'更新失敗 · 保留 '+hhmm(lastSuccess)+' 的資料':'讀取失敗 · 尚無正式資料','error');console.warn('閱讀資料更新失敗：',error.message);
 }finally{clearTimeout(timeout);busy=false;clearTimeout(refreshTimer);refreshTimer=setTimeout(refresh,REFRESH_MS);}
}
function tick(){$('clock').textContent=new Date().toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false});}tick();setInterval(tick,1000);
for(let n=0;n<=100;n+=10){const p=pointAt(n);$('milestones').append(svgNode('text',{x:p.x-390+22,y:p.y-130+8,class:'milestone'}));$('milestones').lastChild.textContent=n;}
$('fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{$('fullscreen').textContent='請按 F11';}});
document.addEventListener('fullscreenchange',()=>{$('fullscreen').textContent=document.fullscreenElement?'⛶ 離開全螢幕':'⛶ 全螢幕';fit();});
addEventListener('online',()=>{clearTimeout(refreshTimer);refresh();});
setInterval(()=>{if(view.length)focus((focusIndex+1)%view.length);},6000);
if(API_URL){$('students').textContent='—';status('正在讀取正式資料…');refresh();}else{roster=normalize(demo());render(roster);}
</script>
</body>
</html>
