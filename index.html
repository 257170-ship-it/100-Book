<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8edce"><title>夢想校園｜手作挑戰樂園</title>
<style>
:root{--ink:#3c3c3a;--cream:#fff9e9;--green:#7eae87;--yellow:#ffc846;--pink:#ef9d9d;--blue:#91c6d5;--shadow:rgba(83,63,36,.18)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#ddcfad;font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink)}#stage{position:absolute;width:1920px;height:1080px;left:0;top:0;transform-origin:top left;overflow:hidden;background:radial-gradient(circle at 14% 12%,#fff7d9 0 12%,transparent 40%),linear-gradient(135deg,#f8e8c4,#f7f0da 52%,#dce8ca)}#stage:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.28;background-image:repeating-linear-gradient(0deg,transparent 0 3px,#aa956c 4px 5px,transparent 6px 9px);mix-blend-mode:multiply}#stage:after{content:"";position:absolute;inset:13px;border:5px dashed #d7b68e;border-radius:24px;pointer-events:none}.decoration{position:absolute;z-index:0;pointer-events:none;font-size:90px;filter:drop-shadow(5px 8px 0 #bda78470)}.d1{right:54px;top:70px;transform:rotate(15deg)}.d2{left:20px;bottom:88px;transform:rotate(-20deg)}.d3{right:38px;bottom:86px;transform:rotate(11deg)}header{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;margin:42px 65px 10px;height:104px}.brand{display:flex;align-items:center;gap:18px}.logo{background:#f7d25d;border:4px solid #66523c;border-radius:24px;font-size:55px;height:87px;width:94px;text-align:center;line-height:80px;box-shadow:5px 6px 0 #ad8960;transform:rotate(-5deg)}.eyebrow{font-size:24px;font-weight:850;color:#8b7655;letter-spacing:5px}.headline{font-size:53px;line-height:1.13;font-weight:1000;text-shadow:2px 3px 0 #fff}.header-right{display:flex;gap:18px;align-items:center}.wood-tag{padding:13px 26px;background:#fff4d7;border:3px dashed #bd9f6f;border-radius:18px;font-weight:900;font-size:23px;white-space:nowrap}.live-dot{display:inline-block;width:15px;height:15px;border-radius:50%;background:#68b37c;margin-right:11px;box-shadow:0 0 0 5px #cceacc}.scene{position:relative;z-index:1;margin:20px 65px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:22px}.stat{height:114px;background:#fffdf2;border:4px solid #c8b28a;border-radius:22px;box-shadow:7px 8px 0 #bca98766;display:flex;justify-content:space-between;align-items:center;padding:18px 25px;position:relative}.stat:after,.card:after{content:"✕   ✕";position:absolute;top:8px;right:16px;color:#b7a789;font-size:15px;letter-spacing:10px;opacity:.75}.stat .k{font-size:25px;font-weight:850;color:#74684d}.stat .v{font-size:51px;font-weight:1000;line-height:1.1}.stat .emoji{font-size:49px}.stage-title{height:75px;display:flex;align-items:center;justify-content:space-between;padding:0 5px}.stage-title h2{font-size:39px;margin:0;text-shadow:2px 3px #fff}.hint{font-size:23px;font-weight:800;color:#736b58}.grid{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,315px);gap:22px}.card{position:relative;min-width:0;overflow:hidden;background:#fff8e8;border:5px solid #c6ad84;border-radius:24px;box-shadow:9px 10px 0 #a997795e;padding:22px 24px}.card:nth-child(4n+2){background:#e9f6ed;border-color:#a2c6a1}.card:nth-child(4n+3){background:#fff0e6;border-color:#d8b5a5}.card:nth-child(4n+4){background:#eaf4f8;border-color:#a2c6d0}.card .button-deco{position:absolute;bottom:13px;right:13px;width:19px;height:19px;border:3px solid #bba487;background:#f6cf85;border-radius:50%;box-shadow:inset 0 0 0 3px #fff1b6}.student-head{display:flex;align-items:center;gap:12px;margin-bottom:13px;min-width:0}.number{background:#f3c65f;color:#5b4e39;border:2px dashed #a88543;border-radius:12px;padding:7px 10px;font-weight:1000;font-size:20px}.student-name{font-size:38px;font-weight:1000;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}.class{font-size:21px;font-weight:850;color:#746c5d;margin-left:auto;white-space:nowrap}.bigline{display:flex;align-items:baseline;gap:8px}.big-number{font-size:49px;font-weight:1000;line-height:1.15;font-variant-numeric:tabular-nums}.sub{font-size:23px;font-weight:900;color:#756a56}.pig-wrap{height:104px;position:relative;margin-top:7px;display:flex;align-items:center;gap:18px}.pig{position:relative;width:160px;height:97px;flex-shrink:0}.pig svg{position:absolute;inset:0;width:100%;height:100%}.pig-fill-track{position:absolute;left:20%;top:28%;width:64%;height:51%;border-radius:42%;overflow:hidden}.pig-fill{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(#ffe58a,#eaaa2d);transition:height 1.2s ease}.pig-info{font-size:23px;font-weight:900;line-height:1.55}.progress-track{height:21px;background:#d8d1bd;border:3px solid #b5a88e;border-radius:20px;overflow:hidden;margin-top:12px}.progress-fill{height:100%;width:0;background:repeating-linear-gradient(110deg,#f5b742 0 24px,#ffd56b 25px 45px);transition:width 1s}.reading-main{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}.flag{font-size:53px}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-top:15px}.step{min-width:0;text-align:center;background:#f6ebd3;border:2px dashed #cfb691;border-radius:10px;padding:9px 0;font-size:17px;font-weight:900}.step b{display:block;font-size:27px;margin-top:2px}.health-entry{margin-top:14px}.health-top{display:flex;align-items:baseline;justify-content:space-between;font-weight:900;font-size:22px}.health-top strong{font-size:29px}.health-small{font-size:19px;color:#816f59;margin-top:5px;font-weight:900}.health-entry .progress-track{height:18px;margin-top:6px}.health-entry.disc .progress-fill{background:repeating-linear-gradient(110deg,#81b5d6 0 24px,#a5dbe8 25px 45px)}.achievement{font-size:24px;font-weight:900;background:#fff1bc;border:2px dashed #cba663;border-radius:12px;padding:9px 14px;display:inline-block;margin-top:14px}.overview-card .ov-icon{font-size:59px;position:absolute;right:20px;top:70px}.overview-card .big-number{font-size:48px}.overview-card .mini-label{font-size:21px;font-weight:900;margin-top:16px}.empty{grid-column:1/-1;display:grid;place-items:center;text-align:center;font-size:31px;font-weight:900;border:4px dashed #bba379;border-radius:22px;background:#fff9e8;line-height:1.7}.footer{position:absolute;z-index:2;bottom:24px;left:68px;right:68px;display:flex;justify-content:space-between;align-items:center;height:44px;font-size:21px;font-weight:850;color:#78694c}.dots{display:flex;gap:10px}.dot{height:14px;width:14px;border-radius:50%;background:#c6b894;border:2px solid #aa9774}.dot.active{width:45px;border-radius:12px;background:#efa85a}.foot-mid{display:flex;align-items:center;gap:18px}.clock-track{height:10px;width:150px;background:#d5c59d;border-radius:15px;overflow:hidden}.clock-bar{height:100%;background:#e8a550;width:100%;transform-origin:left;transition:none}.error{position:absolute;z-index:4;right:67px;bottom:77px;max-width:850px;background:#fff3dd;border:3px solid #d1946e;border-radius:14px;padding:13px 20px;font-size:18px;font-weight:850;display:none}.error.show{display:block}.star{position:absolute;font-size:37px;top:8px;left:18px;opacity:.18}.control{cursor:pointer;user-select:none;background:#fff5d9;border:2px solid #b9a078;border-radius:12px;padding:6px 13px;font:inherit;color:inherit}.control:focus-visible{outline:4px solid #8cbbd3}#pause{font-size:20px}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body><main id="stage" aria-label="校園挑戰輪播電視牆"><span class="decoration d1">🧵</span><span class="decoration d2">🌼</span><span class="decoration d3">🪁</span><header><div class="brand"><div class="logo">🧶</div><div><div class="eyebrow">HANDMADE SCHOOL ADVENTURE</div><div class="headline" id="headline">全校挑戰樂園</div></div></div><div class="header-right"><div class="wood-tag">✨ 每個努力都值得被看見</div><div class="wood-tag"><span class="live-dot" id="liveDot"></span><span id="connection">資料連線中</span></div></div></header><section class="scene"><div class="stats" id="stats"></div><div class="stage-title"><h2 id="sectionTitle">🌟 全校總覽</h2><div class="hint" id="sectionHint">一起闖關、持續累積！</div></div><div class="grid" id="cards"></div></section><div class="error" id="error" role="status"></div><footer class="footer"><div id="timestamp">資料同步準備中</div><div class="foot-mid"><div class="dots" id="dots"></div><span id="pageNumber">1 / 4</span><div class="clock-track"><div class="clock-bar" id="clockBar"></div></div><button class="control" id="pause" aria-label="暫停輪播">❚❚ 暫停</button><button class="control" id="next" aria-label="下一頁">下一頁 ➜</button></div><div>✂️ 用努力拼出自己的冒險地圖</div></footer></main>
<script>
'use strict';
// ===================== 可自行調整的設定 =====================
const CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vT9CEQU5iII381HNhvYdqMo3BGn89t2iSPPA1ZKuM6v4FOPu0k8f-P0wE8oGd6njYgs0AvItdf__iqq/pub?output=csv';
const REWARD_RATE=4;                // 1 點兌換多少元
const SLIDE_SECONDS=15;             // 每頁停留秒數
const FETCH_SECONDS=30;             // 背景讀取間隔秒數
const PAGE_SIZE=8;                  // 每頁 8 人，4 欄 × 2 列
const PIG_GOAL=100;                 // 小豬視覺進度條滿格點數（不限制實際點數）
const READING_GOAL=100;
const ROPE_LEVELS=[600,800,1000];
const DISC_LEVELS=[3000,6000,9000];
// ==========================================================
const $=id=>document.getElementById(id),fmt=n=>Number(n||0).toLocaleString('zh-TW');
let students=[],slides=[],slideIndex=0,slideStarted=performance.now(),paused=false,ready=false,lastUpdate=null,busy=false;
function resize(){const s=Math.min(innerWidth/1920,innerHeight/1080);const stage=$('stage');stage.style.transform=`scale(${s})`;stage.style.left=((innerWidth-1920*s)/2)+'px';stage.style.top=((innerHeight-1080*s)/2)+'px';}addEventListener('resize',resize);resize();
// CSV parser: 支援逗號、引號、欄位內換行及 UTF-8 BOM
function parseCSV(text){text=text.replace(/^\uFEFF/,'');const rows=[];let row=[],field='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){field+='"';i++;}else quoted=!quoted;}else if(c===','&&!quoted){row.push(field);field='';}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);field='';if(row.some(v=>v.trim()))rows.push(row);row=[];}else field+=c;}if(field!==''||row.length){row.push(field);if(row.some(v=>v.trim()))rows.push(row);}return rows;}
const numeric=v=>{const n=Number(String(v??'').replace(/[,，\s]/g,''));return Number.isFinite(n)?Math.max(0,n):0;};
function convertCSV(csv){const rows=parseCSV(csv);if(!rows.length)throw Error('CSV 沒有任何資料');const headers=rows.shift().map((h,i)=>i===0?h.replace(/^\uFEFF/,'').trim():h.trim());const required=['姓名','班級','點數','一階','二階','三階','四階','五階','六階','跳繩次數','飛盤次數'];const missing=required.filter(h=>!headers.includes(h));if(missing.length)throw Error('缺少欄位：'+missing.join('、'));return rows.map((row,i)=>{const get=h=>row[headers.indexOf(h)]??'';const books=['一階','二階','三階','四階','五階','六階'].map(h=>numeric(get(h)));return {id:i,name:String(get('姓名')).trim(),className:String(get('班級')).trim(),points:numeric(get('點數')),books,reading:books.reduce((a,b)=>a+b,0),rope:numeric(get('跳繩次數')),disc:numeric(get('飛盤次數'))};}).filter(x=>x.name);}
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function chunk(arr){const out=[];for(let i=0;i<arr.length;i+=PAGE_SIZE)out.push(arr.slice(i,i+PAGE_SIZE));return out.length?out:[[]];}
function makeSlides(){const byPoints=[...students].sort((a,b)=>b.points-a.points||a.id-b.id);const byBooks=[...students].sort((a,b)=>b.reading-a.reading||a.id-b.id);const byHealth=[...students].sort((a,b)=>(b.rope/1000+b.disc/9000)-(a.rope/1000+a.disc/9000)||a.id-b.id);slides=[{type:'overview',entries:byPoints.slice(0,PAGE_SIZE),part:1,total:1}];for(const [type,arr] of [['pig',byPoints],['reading',byBooks],['health',byHealth]]){const pages=chunk(arr);pages.forEach((entries,idx)=>slides.push({type,entries,part:idx+1,total:pages.length}));}}
function showError(message){$('error').textContent=message;$('error').classList.add('show');$('connection').textContent='更新異常';$('liveDot').style.background='#db9261';}function clearError(){$('error').classList.remove('show');$('connection').textContent='資料已連線';$('liveDot').style.background='#68b37c';}
async function fetchData(){if(busy)return;busy=true;try{const url=new URL(CSV_URL);url.searchParams.set('_t',Date.now());const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),12000);let response;try{response=await fetch(url,{cache:'no-store',signal:controller.signal});}finally{clearTimeout(timeout)}if(!response.ok)throw Error('HTTP '+response.status);const loaded=convertCSV(await response.text());if(!loaded.length)throw Error('CSV 沒有有效學生姓名');const current=slides[slideIndex];students=loaded;makeSlides();if(ready&&current){const matched=slides.findIndex(s=>s.type===current.type&&s.part===current.part);slideIndex=matched>=0?matched:Math.min(slideIndex,slides.length-1);}lastUpdate=new Date();ready=true;clearError();render();}catch(err){console.error('[CSV]',err);showError('⚠️ CSV 更新失敗：'+err.message+(ready?'｜保留上次成功讀取的資料':'｜請檢查試算表公開發佈權限與欄位名稱'));if(!ready)render();}finally{busy=false;}}
function stat(icon,title,value){return `<div class="stat"><div><div class="k">${title}</div><div class="v">${fmt(value)}</div></div><div class="emoji">${icon}</div></div>`;}
function cardBase(s,i,html,extra=''){return `<article class="card ${extra}"><span class="star">✦</span><div class="student-head"><span class="number">#${i+1}</span><span class="student-name" title="${escapeHTML(s.name)}">${escapeHTML(s.name)}</span><span class="class">${escapeHTML(s.className)}</span></div>${html}<div class="button-deco"></div></article>`;}
function pigSVG(){return `<svg viewBox="0 0 175 105" aria-hidden="true"><ellipse cx="92" cy="53" rx="66" ry="39" fill="#f7b5b9" fill-opacity=".38" stroke="#bc777d" stroke-width="5"/><path d="M45 24 L45 6 L69 17 M105 17 L128 4 L132 30" fill="#f9c7c3" stroke="#bc777d" stroke-width="4" stroke-linejoin="round"/><circle cx="140" cy="43" r="5" fill="#78585c"/><ellipse cx="150" cy="61" rx="19" ry="14" fill="#f4a8a9" stroke="#bc777d" stroke-width="4"/><circle cx="145" cy="61" r="3" fill="#985d66"/><circle cx="155" cy="61" r="3" fill="#985d66"/><path d="M50 86 V98 M114 86 V98" stroke="#bc777d" stroke-width="9" stroke-linecap="round"/><path d="M25 63 Q6 50 14 43 Q23 37 25 48" fill="none" stroke="#bc777d" stroke-width="4"/><path d="M72 14 H103" stroke="#916a6b" stroke-width="5" stroke-linecap="round"/></svg>`;}
function pigCard(s,i){const percent=Math.min(s.points/PIG_GOAL*100,100);return cardBase(s,i,`<div class="bigline"><span class="big-number">${fmt(s.points)}</span><span class="sub">點　=　${fmt(s.points*REWARD_RATE)} 元</span></div><div class="pig-wrap"><div class="pig"><div class="pig-fill-track"><div class="pig-fill" style="height:${percent}%"></div></div>${pigSVG()}</div><div class="pig-info">🪙 金幣存入中！<br><span class="sub">目前集滿 ${percent.toFixed(0)}% 撲滿</span></div></div><div class="progress-track"><div class="progress-fill" style="width:${percent}%"></div></div>`);}
function readingCard(s,i){const percent=Math.min(100,s.reading/READING_GOAL*100);return cardBase(s,i,`<div class="reading-main"><div><div class="bigline"><span class="big-number">${fmt(s.reading)}</span><span class="sub">/ ${READING_GOAL} 本</span></div><div class="sub">${s.reading>=READING_GOAL?'🏁 攻頂成功！':'📚 距離攻頂還差 '+fmt(READING_GOAL-s.reading)+' 本'}</div></div><div class="flag">${s.reading>=READING_GOAL?'🏆':'⛰️'}</div></div><div class="progress-track"><div class="progress-fill" style="width:${percent}%"></div></div><div class="steps">${s.books.map((n,j)=>`<div class="step">${j+1} 階<b>${fmt(n)}</b></div>`).join('')}</div>`);}
function status(n,levels){const next=levels.find(v=>n<v);return next===undefined?{label:'🏆 全階段達成！',goal:levels.at(-1),remaining:0}:{label:`下一階 ${fmt(next)} 次｜還差 ${fmt(next-n)} 次`,goal:next,remaining:next-n};}
function healthCard(s,i){const r=status(s.rope,ROPE_LEVELS),d=status(s.disc,DISC_LEVELS);const lane=(label,n,obj,max,type)=>`<div class="health-entry ${type}"><div class="health-top"><span>${label}</span><strong>${fmt(n)} <small>次</small></strong></div><div class="progress-track"><div class="progress-fill" style="width:${Math.min(n/max*100,100)}%"></div></div><div class="health-small">${obj.label}</div></div>`;return cardBase(s,i,`${lane('🪢 跳繩',s.rope,r,1000,'rope')}${lane('🥏 飛盤',s.disc,d,9000,'disc')}<div class="achievement">🌟 闖關加油！每一次都算數</div>`);}
function overviewCard(s,i){return cardBase(s,i,`<div class="ov-icon">${i<3?['🥇','🥈','🥉'][i]:'🐷'}</div><div class="mini-label">🪙 儲蓄點數</div><div class="bigline"><span class="big-number">${fmt(s.points)}</span><span class="sub">點</span></div><div class="mini-label">📖 累積閱讀 ${fmt(s.reading)} 本</div><div class="mini-label">🪢 跳繩 ${fmt(s.rope)}　🥏 飛盤 ${fmt(s.disc)}</div>`, 'overview-card');}
function render(){const totals={points:students.reduce((a,s)=>a+s.points,0),books:students.reduce((a,s)=>a+s.reading,0),rope:students.reduce((a,s)=>a+s.rope,0),disc:students.reduce((a,s)=>a+s.disc,0)};$('stats').innerHTML=stat('🪙','全校累積點數',totals.points)+stat('💰','全校獎勵金（元）',totals.points*REWARD_RATE)+stat('📚','全校閱讀本數',totals.books)+stat('🏃','全校運動次數',totals.rope+totals.disc);if(!slides.length){$('cards').innerHTML='<div class="empty">🧶 正在讀取試算表資料…<br>請確認網路連線及 CSV 公開發佈設定</div>';$('timestamp').textContent='尚未取得資料';return;}const slide=slides[slideIndex]||slides[0];const themes={overview:['全校挑戰樂園','🌟 全校總覽','看看大家努力累積的成果！'],pig:['小豬撲滿大冒險','🐷 小豬撲滿','金幣越存越多，夢想越來越大！'],reading:['百閱登山挑戰','📚 百閱挑戰','閱讀 100 本，登頂插旗！'],health:['健康儲蓄挑戰','🏃 健康儲蓄','跳繩 × 飛盤，雙軌一起闖關！']};const t=themes[slide.type];$('headline').textContent=t[0];$('sectionTitle').textContent=t[1];$('sectionHint').textContent=t[2]+(slide.total>1?`｜第 ${slide.part} / ${slide.total} 組`:'');let start=slide.type==='overview'?0:(slide.part-1)*PAGE_SIZE;const make={overview:overviewCard,pig:pigCard,reading:readingCard,health:healthCard}[slide.type];$('cards').innerHTML=slide.entries.length?slide.entries.map((s,i)=>make(s,start+i)).join(''):'<div class="empty">🧸 尚無學生資料，期待大家一起加入挑戰！</div>';$('pageNumber').textContent=`${slideIndex+1} / ${slides.length}`;$('dots').innerHTML=slides.map((_,i)=>`<span class="dot ${i===slideIndex?'active':''}"></span>`).join('');$('timestamp').textContent=lastUpdate?'最後同步：'+lastUpdate.toLocaleTimeString('zh-TW',{hour12:false}):'尚未取得資料';}
function goNext(){if(!slides.length)return;slideIndex=(slideIndex+1)%slides.length;slideStarted=performance.now();render();}function goPrev(){if(!slides.length)return;slideIndex=(slideIndex-1+slides.length)%slides.length;slideStarted=performance.now();render();}
$('next').addEventListener('click',goNext);$('pause').addEventListener('click',()=>{paused=!paused;$('pause').textContent=paused?'▶ 繼續':'❚❚ 暫停';slideStarted=performance.now();});addEventListener('keydown',e=>{if(e.key==='ArrowRight')goNext();if(e.key==='ArrowLeft')goPrev();if(e.key===' '){e.preventDefault();$('pause').click();}});
function tick(now){if(!paused&&slides.length&&now-slideStarted>=SLIDE_SECONDS*1000)goNext();const progress=paused?1:Math.max(0,1-(now-slideStarted)/(SLIDE_SECONDS*1000));$('clockBar').style.width=(progress*100)+'%';requestAnimationFrame(tick);}render();fetchData();setInterval(fetchData,FETCH_SECONDS*1000);requestAnimationFrame(tick);
</script></body></html>
